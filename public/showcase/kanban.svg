<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
  <title id="title">WorkAtlas demonstration Kanban board</title><desc id="desc">Five task-status columns with priority-coloured cards.</desc><rect width="960" height="600" fill="#f8fafc"/><text x="42" y="58" font-family="Arial" font-size="30" font-weight="700" fill="#0f172a">Kanban board</text><text x="42" y="86" font-family="Arial" font-size="14" fill="#64748b">Drag tasks between status columns; ordering persists automatically.</text>
  <g font-family="Arial" font-size="13" font-weight="700" fill="#334155"><text x="42" y="135">BACKLOG</text><text x="230" y="135">TO DO</text><text x="418" y="135">IN PROGRESS</text><text x="606" y="135">BLOCKED</text><text x="794" y="135">DONE</text></g>
  <g fill="#f1f5f9" stroke="#cbd5e1"><rect x="35" y="150" width="166" height="400" rx="14"/><rect x="223" y="150" width="166" height="400" rx="14"/><rect x="411" y="150" width="166" height="400" rx="14"/><rect x="599" y="150" width="166" height="400" rx="14"/><rect x="787" y="150" width="138" height="400" rx="14"/></g>

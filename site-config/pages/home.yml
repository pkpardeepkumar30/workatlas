route: /
title: WorkAtlas
description: A project and knowledge workspace for research, software, publications, experiments, and long-term ideas.
published: true
sections:
  - type: hero
    eyebrow: Project and knowledge workspace
    title: Turn scattered ideas into a controlled portfolio of work.
    description: WorkAtlas helps researchers, engineers, and independent builders manage ideas, projects, tasks, and public documentation in one maintainable workspace.
    layout: split
    callout:
      title: Weekly focus
      badge: 3 active
      items:
        - Complete benchmark figures
        - Audit the numerical formulation
        - Design the healthcare test case
  - type: buttonGroup
    alignment: left
    buttons:
      - label: Create account
        action: createAccount
        variant: primary
      - label: Read documentation
        action: readDocs
        variant: secondary
  - type: featureGrid
    columns: 4
    items:
      - title: Execution dashboard
        description: Projects, tasks, ideas, Kanban and weekly review in one focused interface.
        icon: layoutDashboard
      - title: Markdown-managed content
        description: Edit public pages and documentation without touching React components.
        icon: fileText
      - title: PostgreSQL foundation
        description: Multi-user data isolation, migrations and a clean path from desktop to VPS.
        icon: database
      - title: Controlled extension points
        description: Named registries allow reusable UI and safe actions without executable YAML.
        icon: shieldCheck
  - type: markdown
    source: home.md
  - type: showcase
    id: product-tour
    source: showcase.md
    items:
      - title: Portfolio dashboard
        image: /showcase/dashboard.svg
        alt: WorkAtlas dashboard with project and task summaries using demonstration data
      - title: Project workspace
        image: /showcase/project.svg
        alt: WorkAtlas project page with task counts, priorities, and due dates using demonstration data
      - title: Kanban planning
        image: /showcase/kanban.svg
        alt: WorkAtlas Kanban board with demonstration tasks arranged by status
